<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐾 台北小旅行 (Taipei Trip)</title>
    <style>
        :root {
            --bg-color: #FFF9F5;
            --primary: #FF9A8B;
            --secondary: #FFC3A0;
            --text-dark: #5D4037;
            --text-light: #8D6E63;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 15px rgba(255, 154, 139, 0.15);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 70px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 20px 15px 15px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .lang-btn {
            position: absolute;
            right: 15px;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .page {
            display: none;
            padding: 20px 15px;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-selector {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .day-selector::-webkit-scrollbar { display: none; }
        
        .day-btn {
            background: var(--card-bg);
            border: 2px solid #FFE0D2;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .day-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 154, 139, 0.4);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 15px;
            box-shadow: var(--shadow);
            position: relative;
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .card .time { font-size: 0.85rem; color: var(--primary); font-weight: bold; }
        .card .title { font-size: 1.1rem; font-weight: bold; }
        .card .desc { font-size: 0.9rem; color: var(--text-light); }
        .card.food-item { border-left-color: #FFB6C1; }
        .card.custom-item { border-left-color: #81C784; }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .food-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .food-card .emoji { font-size: 2rem; margin-bottom: 5px; }
        .food-card .name { font-size: 1rem; font-weight: bold; margin-bottom: 5px;}
        .food-card .tag { font-size: 0.75rem; color: var(--primary); background: #FFF0F0; padding: 2px 8px; border-radius: 10px;}
        
        .add-btn {
            margin-top: 10px;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .modal select {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid var(--secondary);
            color: var(--text-dark);
            outline: none;
        }
        .modal-btns { display: flex; gap: 10px; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; font-weight: bold;}
        .btn-cancel { background: #E0E0E0; color: var(--text-dark); border: none; padding: 10px; border-radius: 10px; flex: 1; font-weight: bold;}

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label { font-size: 0.9rem; font-weight: bold; color: var(--text-light); }
        .form-group input, .form-group select {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #FFE0D2;
            background: var(--card-bg);
            outline: none;
            color: var(--text-dark);
            font-size: 1rem;
        }
        .submit-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: var(--shadow);
            margin-top: 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #BCAAA4;
            font-size: 0.8rem;
            gap: 4px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-item.active {
            color: var(--primary);
            transform: translateY(-3px);
        }
        .nav-icon { font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1 data-i18n="headerTitle">🐾 台北潮玩之旅</h1>
        <button class="lang-btn" onclick="toggleLanguage()">EN / 中</button>
    </header>

    <!-- Page 1: Itinerary -->
    <div id="page-schedule" class="page active">
        <div class="day-selector" id="daySelector">
            <!-- Rendered via JS to support language switch -->
        </div>
        
        <div class="timeline" id="timelineContainer"></div>
    </div>

    <!-- Page 2: Food / Explore -->
    <div id="page-food" class="page">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;" data-i18n="foodTitle">🍡 必吃推荐清单</h2>
        <div class="food-grid" id="foodContainer">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Page 3: Add via Map -->
    <div id="page-map" class="page">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;" data-i18n="mapTitle">📍 自定义添加行程</h2>
        <div style="background: var(--card-bg); padding: 20px; border-radius: 18px; box-shadow: var(--shadow);">
            <div class="form-group">
                <label data-i18n="mapNameLabel">你想去哪里？(地点名称)</label>
                <input type="text" id="customName" placeholder="例如：宁夏夜市" data-i18n-ph="mapNamePh" autocomplete="off">
            </div>
            <div class="form-group">
                <label data-i18n="mapLinkLabel">Google Map 链接 (选填)</label>
                <input type="text" id="customLink" placeholder="粘贴地图分享链接..." data-i18n-ph="mapLinkPh" autocomplete="off">
            </div>
            <div class="form-group">
                <label data-i18n="mapDayLabel">安排在第几天？</label>
                <select id="customDay">
                    <option value="1">Day 1</option>
                    <option value="2">Day 2</option>
                    <option value="3">Day 3</option>
                    <option value="4">Day 4</option>
                    <option value="5">Day 5</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="mapTimeLabel">大约时间 (选填)</label>
                <input type="time" id="customTime" value="15:00">
            </div>
            <button class="submit-btn" onclick="addCustomPlace()" data-i18n="mapBtn">✨ 加入到行程表</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('schedule', this)">
            <span class="nav-icon">🗓️</span>
            <span data-i18n="navSchedule">日程</span>
        </div>
        <div class="nav-item" onclick="switchTab('food', this)">
            <span class="nav-icon">🍡</span>
            <span data-i18n="navFood">探店</span>
        </div>
        <div class="nav-item" onclick="switchTab('map', this)">
            <span class="nav-icon">🗺️</span>
            <span data-i18n="navMap">地图添加</span>
        </div>
    </nav>

    <!-- Modal for adding food -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--primary); margin-bottom: 5px;"></h3>
            <p style="font-size:0.85rem; color:var(--text-light)" data-i18n="modalDesc">安排在哪一天去吃呢？</p>
            <select id="modalDay">
                <option value="1">Day 1</option>
                <option value="2">Day 2</option>
                <option value="3">Day 3</option>
                <option value="4">Day 4</option>
                <option value="5">Day 5</option>
            </select>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()" data-i18n="modalCancel">取消</button>
                <button class="btn-confirm" onclick="confirmAdd()" data-i18n="modalConfirm">确定</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure with bilingual support
        let currentLang = 'zh';

        const i18n = {
            zh: {
                headerTitle: "🐾 台北潮玩之旅",
                foodTitle: "🍡 必吃推荐清单",
                mapTitle: "📍 自定义添加行程",
                mapNameLabel: "你想去哪里？(地点名称)",
                mapNamePh: "例如：宁夏夜市",
                mapLinkLabel: "Google Map 链接 (选填)",
                mapLinkPh: "粘贴地图分享链接...",
                mapDayLabel: "安排在第几天？",
                mapTimeLabel: "大约时间 (选填)",
                mapBtn: "✨ 加入到行程表",
                navSchedule: "日程",
                navFood: "探店",
                navMap: "自定义",
                modalDesc: "安排在哪一天去吃呢？",
                modalCancel: "取消",
                modalConfirm: "确定",
                addBtn: "加入日程",
                checkMap: "📍 查看 Google Map",
                alertFood: " 已成功加入日程！🎉",
                alertMap: " 已成功加入行程表！",
                alertEmpty: "请输入地点名称哦！",
                customType: "自定义添加",
                timeAny: "待定时间"
            },
            en: {
                headerTitle: "🐾 Taipei Fun Trip",
                foodTitle: "🍡 Must-Eat List",
                mapTitle: "📍 Add Custom Place",
                mapNameLabel: "Where to? (Place Name)",
                mapNamePh: "e.g., Ningxia Night Market",
                mapLinkLabel: "Google Map Link (Optional)",
                mapLinkPh: "Paste map link here...",
                mapDayLabel: "Which day?",
                mapTimeLabel: "Estimated Time (Optional)",
                mapBtn: "✨ Add to Itinerary",
                navSchedule: "Plan",
                navFood: "Food",
                navMap: "Custom",
                modalDesc: "Which day to schedule this?",
                modalCancel: "Cancel",
                modalConfirm: "Confirm",
                addBtn: "Add to Plan",
                checkMap: "📍 Open in Maps",
                alertFood: " successfully added to your plan! 🎉",
                alertMap: " successfully added to itinerary!",
                alertEmpty: "Please enter a place name!",
                customType: "Custom Add",
                timeAny: "Anytime"
            }
        };

        const dayLabels = {
            zh: ["淡水八里", "九份十分", "101西门", "大稻埕", "淡水返程"],
            en: ["Tamsui/Bali", "Jiufen/Shifen", "101/Ximen", "Dadaocheng", "Tamsui/Dep"]
        };

        let scheduleData = {
            1: [
                { time: "06:00", title: {zh: "桃园机场抵达", en: "Arrive at Taoyuan Airport"}, desc: {zh: "入境、领取悠游卡", en: "Immigration, Get EasyCard"}, type: "default" },
                { time: "10:30", title: {zh: "淡水老街", en: "Tamsui Old Street"}, desc: {zh: "放行李、吃文化阿给早午餐", en: "Drop luggage, A-Gei Brunch"}, type: "default" },
                { time: "14:00", title: {zh: "八里左岸骑行", en: "Bali Left Bank"}, desc: {zh: "搭渡轮、租协力车逛老街", en: "Ferry & Tandem biking"}, type: "default" },
                { time: "17:30", title: {zh: "渔人码头", en: "Fisherman's Wharf"}, desc: {zh: "情人桥赏夕阳日落", en: "Lover Bridge sunset"}, type: "default" },
                { time: "19:30", title: {zh: "北投温泉", en: "Beitou Hot Springs"}, desc: {zh: "汤屋泡汤放松身心", en: "Relax in bathhouse"}, type: "default" },
                { time: "21:30", title: {zh: "士林夜市", en: "Shilin Night Market"}, desc: {zh: "夜宵狂欢、回淡水休息", en: "Late-night food crawl"}, type: "default" }
            ],
            2: [
                { time: "09:00", title: {zh: "出发瑞芳", en: "Head to Ruifang"}, desc: {zh: "搭乘捷运转台铁", en: "MRT to TRA Train"}, type: "default" },
                { time: "11:00", title: {zh: "十分瀑布 & 老街", en: "Shifen Waterfall & Street"}, desc: {zh: "看瀑布、铁道放天灯祈福", en: "Sky lantern release"}, type: "default" },
                { time: "14:30", title: {zh: "九份山城", en: "Jiufen Mountain Town"}, desc: {zh: "竖崎路红灯笼、茶楼看阴阳海", en: "Red lanterns & Tea houses"}, type: "default" },
                { time: "19:00", title: {zh: "饶河街夜市", en: "Raohe Night Market"}, desc: {zh: "米其林必比登美食打卡", en: "Michelin Bib Gourmand eats"}, type: "default" }
            ],
            3: [
                { time: "11:00", title: {zh: "台北 101", en: "Taipei 101"}, desc: {zh: "登89楼观景台看城市全景", en: "89F Observatory view"}, type: "default" },
                { time: "13:00", title: {zh: "信义商圈午餐", en: "Xinyi District Lunch"}, desc: {zh: "逛街与美食", en: "Shopping & Dining"}, type: "default" },
                { time: "15:30", title: {zh: "西门町潮流街区", en: "Ximending"}, desc: {zh: "万年大楼、拍贴机、吃小吃", en: "Trendy shops & street food"}, type: "default" }
            ],
            4: [
                { time: "10:30", title: {zh: "大稻埕 迪化街", en: "Dadaocheng / Dihua St"}, desc: {zh: "复古洋楼、手冲咖啡与文创", en: "Heritage cafes & shops"}, type: "default" },
                { time: "14:30", title: {zh: "华山1914文创园", en: "Huashan 1914 Park"}, desc: {zh: "看特展、喝世界冠军咖啡", en: "Exhibitions & Champion Coffee"}, type: "default" },
                { time: "18:00", title: {zh: "大稻埕码头市集", en: "Pier 5 Container Market"}, desc: {zh: "吹河风看夕阳喝精酿", en: "Riverside sunset & beers"}, type: "default" },
                { time: "20:00", title: {zh: "宁夏夜市", en: "Ningxia Night Market"}, desc: {zh: "老台北美食连击", en: "Classic Taipei delicacies"}, type: "default" }
            ],
            5: [
                { time: "10:00", title: {zh: "淡水河畔漫步", en: "Tamsui Riverside"}, desc: {zh: "睡到自然醒、景观咖啡厅打卡", en: "Morning coffee & chill"}, type: "default" },
                { time: "13:30", title: {zh: "出发机场", en: "Head to Airport"}, desc: {zh: "取行李、搭机捷", en: "Get luggage, Airport MRT"}, type: "default" },
                { time: "16:00", title: {zh: "航班起飞", en: "Flight Departure"}, desc: {zh: "返回温馨的家", en: "Fly back home"}, type: "default" }
            ]
        };

        const foodData = [
            { emoji: "🥟", title: {zh: "鼎泰丰(101店)", en: "Din Tai Fung"}, tag: {zh: "米其林必比登", en: "Michelin"}, desc: {zh: "美食: 小笼包、排骨炒饭", en: "Food: Xiao Long Bao"} },
            { emoji: "🍗", title: {zh: "豪大大鸡排", en: "Hot-Star Chicken"}, tag: {zh: "士林夜市", en: "Shilin"}, desc: {zh: "美食: 超大炸鸡排", en: "Food: Giant Fried Chicken"} },
            { emoji: "🍜", title: {zh: "阿宗面线", en: "Ay-Chung Noodle"}, tag: {zh: "西门町", en: "Ximending"}, desc: {zh: "美食: 柴鱼大肠面线", en: "Food: Flour-Rice Noodle"} },
            { emoji: "🧋", title: {zh: "阿妹茶楼", en: "A-Mei Tea House"}, tag: {zh: "九份老街", en: "Jiufen"}, desc: {zh: "下午茶: 高山茶与绝美海景", en: "Tea: Sea view & Oolong"} },
            { emoji: "☕", title: {zh: "兴波咖啡", en: "Simple Kaffa"}, tag: {zh: "华山文创", en: "Huashan"}, desc: {zh: "咖啡: 世界冠军手冲", en: "Coffee: World Champion"} },
            { emoji: "🍩", title: {zh: "姊妹双胞胎", en: "Sisters Twins"}, tag: {zh: "八里老街", en: "Bali"}, desc: {zh: "小吃: 炸双胞胎、甜甜圈", en: "Snack: Fried Donuts"} }
        ];

        let currentDay = 1;

        // Apply Language Updates
        function applyTranslations() {
            // Update static strings
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18n[currentLang][key]) {
                    el.placeholder = i18n[currentLang][key];
                }
            });

            renderDaySelector();
            renderTimeline();
            renderFoodGrid();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            applyTranslations();
        }

        // Render Day Selector
        function renderDaySelector() {
            const container = document.getElementById('daySelector');
            container.innerHTML = "";
            for (let i = 1; i <= 5; i++) {
                const label = dayLabels[currentLang][i-1];
                const activeCls = (i === currentDay) ? "active" : "";
                container.innerHTML += `<div class="day-btn ${activeCls}" onclick="showDay(${i})">Day ${i}<br><small>${label}</small></div>`;
            }
        }

        // Render Timeline
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = "";
            
            scheduleData[currentDay].sort((a, b) => a.time.localeCompare(b.time));

            scheduleData[currentDay].forEach(item => {
                let cardClass = "card";
                if(item.type === "food") cardClass += " food-item";
                if(item.type === "custom") cardClass += " custom-item";
                
                const titleStr = typeof item.title === 'object' ? item.title[currentLang] : item.title;
                const descStr = typeof item.desc === 'object' ? item.desc[currentLang] : item.desc;
                const checkMapText = i18n[currentLang].checkMap;

                let linkHtml = item.link ? `<a href="${item.link}" target="_blank" style="font-size:0.8rem; color:#4285F4; text-decoration:none; margin-top:5px;">${checkMapText}</a>` : "";

                container.innerHTML += `
                    <div class="${cardClass}">
                        <div class="time">${item.time}</div>
                        <div class="title">${titleStr}</div>
                        <div class="desc">${descStr}</div>
                        ${linkHtml}
                    </div>
                `;
            });
        }

        // Render Food Grid
        function renderFoodGrid() {
            const container = document.getElementById('foodContainer');
            container.innerHTML = "";
            foodData.forEach((food, idx) => {
                const btnText = i18n[currentLang].addBtn;
                container.innerHTML += `
                    <div class="food-card">
                        <div class="emoji">${food.emoji}</div>
                        <div class="name">${food.title[currentLang]}</div>
                        <div class="tag">${food.tag[currentLang]}</div>
                        <button class="add-btn" onclick="openModal(${idx})">${btnText}</button>
                    </div>
                `;
            });
        }

        // Switch Day in Itinerary
        function showDay(day) {
            currentDay = day;
            renderDaySelector();
            renderTimeline();
        }

        // Switch Tabs (Bottom Nav)
        function switchTab(pageId, navElement) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            navElement.classList.add('active');
            
            if(pageId === 'schedule') {
                renderTimeline();
            }
        }

        // Modal Logic for adding Food
        let tempFoodIdx = null;
        function openModal(idx) {
            tempFoodIdx = idx;
            const food = foodData[idx];
            // Format title dynamically for modal
            document.getElementById('modalTitle').innerText = (currentLang === 'zh' ? "添加: " : "Add: ") + food.title[currentLang];
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            tempFoodIdx = null;
        }

        function confirmAdd() {
            const day = parseInt(document.getElementById('modalDay').value);
            const food = foodData[tempFoodIdx];
            
            const newItem = {
                time: i18n[currentLang].timeAny,
                title: food.title,
                desc: food.desc,
                type: "food"
            };
            
            scheduleData[day].push(newItem);
            
            const titleStr = food.title[currentLang];
            alert(titleStr + i18n[currentLang].alertFood);
            closeModal();
            
            // Auto switch to schedule tab
            switchTab('schedule', document.querySelector('.nav-item'));
            showDay(day);
            
            // Scroll day selector to view
            const daySelector = document.getElementById('daySelector');
            daySelector.children[day-1].scrollIntoView({behavior: 'smooth', inline: 'center'});
        }

        // Add custom place from Map Tab
        function addCustomPlace() {
            const name = document.getElementById('customName').value;
            const link = document.getElementById('customLink').value;
            const day = parseInt(document.getElementById('customDay').value);
            const timeInput = document.getElementById('customTime').value;

            if (!name) {
                alert(i18n[currentLang].alertEmpty);
                return;
            }

            scheduleData[day].push({
                time: timeInput || i18n[currentLang].timeAny,
                title: name,
                desc: i18n[currentLang].customType,
                link: link,
                type: "custom"
            });

            alert(name + i18n[currentLang].alertMap);
            
            // Clear form
            document.getElementById('customName').value = "";
            document.getElementById('customLink').value = "";
            
            // Switch to view it
            switchTab('schedule', document.querySelector('.nav-item'));
            showDay(day);
        }

        // Init
        applyTranslations();
    </script>
</body>
</html>
